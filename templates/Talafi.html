                      <td><span class={`priority ${row[2] >= 0.0 ? 'priority-high' : ''}`}>{row[2] >= 0.0 ? '+' : ''}{row[2].toFixed(1).replace(/\d(?=(\d{3})+\.)/g, '$&,')}%</span></td>
                      <td><span className={`status ${row[3] >= 0.0 ? 'status-active' : 'status-review'}`}>{row[3] >= 0.0 ? '+' : ''}{row[3].toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,')}%</span></td>
                    </tr>)}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="table-container">
            <p style={{float: 'right'}} class="table-title">دارایی شما نزد ماوخودتان</p>
            <div style={{float: 'left', fontSize: '.9em', marginLeft: 'var(--radius-lg)'}}>
              <div class="inline-button touchable" style={{background: 'var(--orange)'}} onClick={() => {window.history.pushState({urlPath: `${window.prefix}/trade`}, "", `${window.prefix}/trade`); this.state.view.push('trade'); this.setState({view: this.state.view})}}>خرید و فروش</div>
              <div class="inline-button touchable" style={{background: 'var(--green)'}} onClick={() => {window.history.pushState({urlPath: `${window.prefix}/asset`}, "", `${window.prefix}/asset`); this.state.view.push('chartAsset'); this.setState({view: this.state.view})}}>جزئیات</div>
              <div class="inline-button touchable" style={{background: 'var(--ink-mid)'}} onClick={() => {window.history.pushState({urlPath: `${window.prefix}/news`}, "", `${window.prefix}/news`); this.state.view.push('news'); this.setState({view: this.state.view})}}>تحلیل</div>
            </div>
            <div class="table-card">
              <div class="footable-wrapper">
                <table class="footable" data-paging="false" data-sorting="true">
                  <thead>
                    <tr>
                      <th data-breakpoints="">اموال</th>
                      <th data-breakpoints="xs">ارزش(تومان)</th>
                      <th data-breakpoints="">مقدار(گرم)</th>
                      <th data-breakpoints="xs sm">وصول شده</th>
                    </tr>
                  </thead>
                  <tbody>
                    {this.state.minAsset.map((row, ri) => <tr>
                      <td>{row[0]}</td>
                      <td>{row[1].toFixed(1).replace(/\d(?=(\d{3})+\.)/g, '$&,').split('.')[0]}</td>
                      <td><span class='mono' >{row[2].toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,')} gr</span></td>
                      <td><span class="status status-inactive">{row[3].toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,')} gr</span></td>
                    </tr>)}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      } post (p, pi) {
        return <div class="post" style={{marginTop: 0}}>
          <Player vid={p.vid} res={p.res} markers={p.markers} style={{height: '100dvh'}}/>
          <div style={{cursor: 'pointer', lineHeight: 0, height: 24, width: 24, alignSelf: 'end', position: 'relative', marginTop: -64, right: 12, bottom: 88}} onClick={() => {p.mark = 'mark' in p ? true : !p.mark; p.mark ? setCookie(p.vid) : delCookie(p.vid); this.setState({list: this.state.list})}}>
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill={p.mark ? "#f00" : "none"}><path d="M5 6.2C5 5.07989 5 4.51984 5.21799 4.09202C5.40973 3.71569 5.71569 3.40973 6.09202 3.21799C6.51984 3 7.07989 3 8.2 3H15.8C16.9201 3 17.4802 3 17.908 3.21799C18.2843 3.40973 18.5903 3.71569 18.782 4.09202C19 4.51984 19 5.07989 19 6.2V21L12 16L5 21V6.2Z" stroke={p.mark ? "#f00" : "#fff"} stroke-width="2" stroke-linejoin="round"/></svg>
          </div>
          <div class="touchable" style={{alignSelf: 'end', position: 'relative', color: 'white', height: 20, fontWeight: 600, right: 12, bottom: 64, fontSize: '.85em'}} onClick={() => { window.history.pushState({urlPath: `${window.prefix}/wiki`}, "", `${window.prefix}/wiki`); this.state.view.push('wiki'); this.setState({view: this.state.view}) }}>بیشتر</div>
          <div class="touchable" style={{alignSelf: 'end', position: 'relative', color: 'white', height: 20, fontSize: '.9em', right: 12, bottom: 44}}>{p.vid.split('_')[p.vid.split('_').length - 1]}</div>
        </div>
      } postList () {
        return <div style={{minHeight: '100dvh', maxHeight: '100dvh', overflowY: 'hidden'}}>
          <div ref={(node) => window.listElem = node} style={{flexBasis: '100vw', minHeight: '100%', maxHeight: '100dvh', overflowY: 'scroll', scrollSnapType: 'y mandatory'}} onScroll={(e) => {this.setState({snap: Math.floor(e.target.scrollTop / (window.listElem.clientHeight - 1))})}}>
            {this.state.list.map((post, pi) => 'vid' in post ? this.post(post, pi) : this.chartPrice())}
          </div>
        </div>
      } explore () {  // age category nabud wiki va ela
        return <div>
          {this.state.explore.map((p, ip) => <div class="square explore" style={{backgroundImage: `url(/static${window.prefix}${'کد محصول' in p.detail ? '/pr' : ''}/${p.images[0]}.jpg)`, width: [3, 4, 7, 8].includes(ip % 10) ? '25vw' : '50vw'}} onClick={async () => {
              if('کد محصول' in p.detail) {this.state.view.push('wiki'); let url = `${window.prefix}/pr/${p.detail['کد محصول']}`; window.history.pushState({urlPath: url}, '', url); this.setState({view: this.state.view, wiki: p, snap: 0})}
              else if ('content' in p) {this.state.view.push('wiki'); let url = `${window.prefix}/wiki/${p.title}`; window.history.pushState({urlPath: url}, '', url); this.setState({view: this.state.view, wiki: p, snap: 0})}
              else {this.state.view.push('explore'); let url = `${window.prefix}/jewelry`; window.history.pushState({urlPath: url}, '', url); this.setState({view: this.state.view, snap: 0})}
            }}>
            <div><div class="title">{p.title}</div></div></div>)}
        </div>
      } wiki () {
        return <div>
          <div class="square" style={{backgroundImage: `url('/static${window.prefix}${'کد محصول' in this.state.wiki.detail ? '/pr' : ''}/${this.state.wiki.images[0]}.jpg')`, height: '100vw', width: '100vw'}}>
            <div style={{cursor: 'pointer', padding: 14, float: 'left', lineHeight: 0, margin: 6}} onClick={() => {this.state.wiki.mark = 'mark' in this.state.wiki ? !this.state.wiki.mark : true; let cook = 'کد محصول' in this.state.wiki.detail ? this.state.wiki.detail['کد محصول'] : this.state.wiki.title; this.state.wiki.mark ? setCookie(cook) : delCookie(cook); this.setState({wiki: this.state.wiki})}}>
              <svg width="24px" height="24px" viewBox="0 0 24 24" fill={this.state.wiki.mark ? "#f00" : "none"}><path d="M5 6.2C5 5.07989 5 4.51984 5.21799 4.09202C5.40973 3.71569 5.71569 3.40973 6.09202 3.21799C6.51984 3 7.07989 3 8.2 3H15.8C16.9201 3 17.4802 3 17.908 3.21799C18.2843 3.40973 18.5903 3.71569 18.782 4.09202C19 4.51984 19 5.07989 19 6.2V21L12 16L5 21V6.2Z" stroke={this.state.wiki.mark ? "#f00" : "#71717a"} stroke-width="2" stroke-linejoin="round"/></svg>
            </div>
            <div class="touchable" style={{padding: 14, float: 'right', lineHeight: 0, margin: 6}} onClick={() => {if (this.state.view.length == 1) {this.setState({view: ['postList']}); window.history.replaceState({urlPath: window.prefix}, '', window.prefix)} else window.history.back()}}>
              <svg fill="#71717a" width="20px" height="20px" viewBox="0 0 1024 1024" transform="scale(-1 1)"><path d="M222.927 580.115l301.354 328.512c24.354 28.708 20.825 71.724-7.883 96.078s-71.724 20.825-96.078-7.883L19.576 559.963a67.846 67.846 0 01-13.784-20.022 68.03 68.03 0 01-5.977-29.488l.001-.063a68.343 68.343 0 017.265-29.134 68.28 68.28 0 011.384-2.6 67.59 67.59 0 0110.102-13.687L429.966 21.113c25.592-27.611 68.721-29.247 96.331-3.656s29.247 68.721 3.656 96.331L224.088 443.784h730.46c37.647 0 68.166 30.519 68.166 68.166s-30.519 68.166-68.166 68.166H222.927z"/></svg>
            </div>
          </div>
          <div style={{padding: '0 15px', width: '100%'}}>
            <ul class="breadcrumb" style={{marginTop: 13}}>  {this.state.wiki.tail.map((t, it) => <li><a href="/"> {t} </a></li>)}</ul>
            <div style={{marginTop: 15, marginBottom: 14, paddingBottom: 15}}>
              <h1 class="pr-head">{this.state.wiki.title}</h1>
              <span class="pr-code mono">{this.state.wiki.detail['کد محصول']}</span>
            </div>
            <div class="row pr-info-row">
              <div class="info-con">
                {Object.keys(this.state.wiki.detail).map((key, ikey) => <div class="info-item">
                  <div class="ttl">{key}</div>
                  <div class="val en">{this.state.wiki.detail[key]}</div>
                </div>)}
              </div>
              {!'content' in this.state.wiki && <div class="link-con">
                <a target="_blank" href="/guide/#shopping-guide">راهنمای خرید</a>
                <a target="_blank" href="/guide/#shopping-guide">راهنمای اقساط</a>
                <a target="_blank" href="/guide/#faq">محاسبه قیمت</a>
                <a style={{background: '#21304d', color: 'white', padding: 'var(--radius-button) var(--radius-lg)', borderRadius: 'var(--radius-button)', fontWeight: 600, marginTop: -5, marginBottom: -2}} target="" href="#" onClick={(e) => {
                  window.history.pushState({urlPath: `${window.prefix}/trade`}, "", `${window.prefix}/trade`); this.state.view.push('trade'); this.setState({'view': this.state.view})
                  e.preventDefault();
                }}>خرید</a>
              </div>}
            </div>
          </div>
          {'content' in this.state.wiki && this.state.wiki.content.map(c => <div style={{marginTop: 5, direction: 'rtl'}}>
            <div class="square" style={{backgroundColor: c.image, height: '100vw', width: '100vw'}}></div>
            <h2 class="pr-head">{c.title}</h2>
            <p style={{padding: '0 15px'}}>{c.text}</p>
          </div>)}
          <div style={{fontSize: 0, marginTop: 10}}>
            {this.state.wiki.images.slice(1).map((im, imi) => <div class="square" style={{backgroundImage: `url('/static${window.prefix}${'کد محصول' in this.state.wiki.detail ? '/pr' : ''}/${im}.jpg')`}}></div>)}
          </div>
        </div>
      } render () { return <div style={{height: '100%'}}>{this.nav()}{this[this.state.view[this.state.view.length - 1]]()}</div> }
    }
  ReactDOM.render(<App/>, document.getElementById('app'))</script></body></html>
